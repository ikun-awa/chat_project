# 测试时用 H2 内存数据库
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

chat.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
chat.datasource.driver-class-name=org.h2.Driver
chat.datasource.username=sa
chat.datasource.password=

# 每次测试启动都自动创建并在结束时丢弃表
spring.jpa.hibernate.ddl-auto=create-drop
chat.jpa.hibernate.ddl-auto=create-drop
chat.jpa.database-platform=org.hibernate.dialect.H2Dialect
chat.jpa.show-sql=false

# JWT
security.jwt.secret=test_secret_for_ci_only_1234567890
security.jwt.expiration=86400000

# 日志级别可选（让测试时 SQL 更可见）
logging.level.org.hibernate.SQL=DEBUG

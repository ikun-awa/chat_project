<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <title>聊天大厅</title>
  <link rel="icon" href="../Icon/icon.jpg" type="image/x-icon">
  <link href="../Bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="../Bootstrap/B-icon/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { padding-top: 4rem; }
    .group-card { cursor: pointer; transition: box-shadow .2s; }
    .group-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  </style>
</head>
<body>


<!-- 顶部导航 -->
<nav class="navbar navbar-light bg-light fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#">Chat Lobby</a>

    <!-- 新增头像下拉 -->
    <div class="dropdown ms-auto">
      <a class="nav-link dropdown-toggle" href="#" id="userMenu" data-bs-toggle="dropdown">
        <img src="/Icon/icon.jpg" width="32" height="32" class="rounded-circle">
      </a>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
        <li>
          <h6 class="dropdown-header" id="usernameDisplay">Loading…</h6>
          <h6 class="dropdown-header" id="userMeta">Loading…</h6>
        </li>
        <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>

      </ul>
    </div>
  </div>
</nav>

<div class="container">

  <!-- 新建群聊 -->
  <div class="row my-4">
    <div class="col-md-6 offset-md-3">
      <div class="input-group">
        <input type="text" id="newGroupName" class="form-control" placeholder="Enter new group name…">
        <button id="createGroupBtn" class="btn btn-primary">
          <i class="bi bi-plus-circle"></i> Create
        </button>
      </div>
    </div>
  </div>

  <!-- 群聊列表 -->
  <div class="row" id="groupList">
    <!-- JS 会动态插入已有群卡片 -->
  </div>

</div>

<script src="../jQuery/jquery-3.7.1.min.js"></script>
<script src="../Bootstrap/bootstrap.bundle.min.js"></script>
<script src="../js/lobby.js"></script>
<script>
  const token = localStorage.getItem('jwtToken');

  const renderGroups = (groups = []) => {
    $('#groupList').empty();
    groups.forEach(g => {
      const card = $(`
        <div class="col-sm-6 col-md-4 mb-3">
          <div class="card group-card" data-id="${g.id}">
            <div class="card-body d-flex align-items-center">
              <img src="../Icon/icon.jpg" class="group-icon rounded" width="40" height="40">
              <h5 class="card-title mb-0 ms-2">${g.name}</h5>
            </div>
            <div class="card-footer text-center">${g.description || ''}</div>
          </div>
        </div>`);
      card.on('click', () => {
        window.location.href = `../chat/chat.html?groupId=${g.id}`;
      });
      $('#groupList').append(card);
    });
  };

  async function loadRooms() {
    const res = await fetch('/api/lobby', {
      headers: token ? { 'Authorization': 'Bearer ' + token } : {}
    });
    if (!res.ok) throw new Error('网络错误 ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('后端返回数据异常');
    renderGroups(data);
    return data;
  }

  async function createRoom() {
    const name = $('#newGroupName').val().trim();
    if (!name) {
      alert('Please enter a group name.');
      return;
    }

    const resp = await fetch('/api/chat-rooms', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': 'Bearer ' + token } : {})
      },
      body: JSON.stringify({ name })
    });

    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(text || ('创建失败: ' + resp.status));
    }

    $('#newGroupName').val('');
    await loadRooms();
  }

  $(function() {
    loadRooms().catch(err => {
      console.error('拉取聊天室列表失败', err);
      $('#groupList').html('<div class="text-danger">加载失败，请稍后重试</div>');
    });

    $('#createGroupBtn').on('click', () => {
      createRoom().catch(err => {
        console.error(err);
        alert(err.message || '创建聊天室失败');
      });
    });
  });
</script>
</body>
</html>

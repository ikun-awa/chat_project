<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>聊天大厅</title>
  <link rel="icon" href="../Icon/icon.jpg" type="image/x-icon">
  <link href="../Bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="../Bootstrap/B-icon/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { padding-top: 4rem; }
    .group-card { cursor: pointer; transition: box-shadow .2s; }
    .group-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  </style>
</head>
<body>


<!-- 顶部导航 -->
<nav class="navbar navbar-light bg-light fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#">Chat Lobby</a>

    <!-- 右侧：用户头像 + 下拉菜单 -->
    <ul class="navbar-nav ms-auto">
      <li class="nav-item dropdown">
        <!-- 头像触发下拉 -->
        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button"
           data-bs-toggle="dropdown" aria-expanded="false">
          <img src="../Icon/icon.jpg" id="userAvatar" class="rounded-circle" width="32" height="32" alt="User">
        </a>
        <!-- 下拉菜单内容 -->
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown" style="min-width: 200px;">
          <li class="px-3 py-2">
            <strong id="menuUsername">——</strong><br>
            <small id="menuGenderAge" class="text-muted">——</small>
          </li>
          <li><hr class="dropdown-divider"></li>
          <li class="px-3">
            <button id="logoutBtn" class="btn btn-sm btn-outline-danger w-100">Logout</button>
          </li>
        </ul>
      </li>
    </ul>
  </div>
</nav>

<div class="container">

  <!-- 新建群聊 -->
  <div class="row my-4">
    <div class="col-md-6 offset-md-3">
      <div class="input-group">
        <input type="text" id="newGroupName" class="form-control" placeholder="Enter new group name…">
        <button id="createGroupBtn" class="btn btn-primary">
          <i class="bi bi-plus-circle"></i> Create
        </button>
      </div>
    </div>
  </div>

  <!-- 群聊列表 -->
  <div class="row" id="groupList">
    <!-- JS 会动态插入已有群卡片 -->
  </div>

</div>

<script src="../jQuery/jquery-3.7.1.min.js"></script>
<script src="../Bootstrap/bootstrap.bundle.min.js"></script>
<script>
  // TODO: 这里改为从你后端接口获取
  /*
  let groups = [
    { id: 'g1', name: 'Family Chat' , des: 'Official chat room' },
    { id: 'g2', name: 'Office Talk' , des: 'private chat room' },
    { id: 'g3', name: 'Gaming Buddies' , des: 'test chat room' }
  ];

   */



  //群聊组

  const renderGroups = groups => {
    $('#groupList').empty();
    groups.forEach(g => {
      const card = $(`
        <div class="col-sm-6 col-md-4 mb-3">
          <div class="card group-card" data-id="${g.id}">
            <div class="card-body d-flex align-items-center">
              <img src="../Icon/icon.jpg" class="group-icon rounded" width="40" height="40">
              <h5 class="card-title mb-0 ms-2">${g.name}</h5>
            </div>
            <div class="card-footer text-center">${g.description || ''}</div>
          </div>
        </div>`);
      card.on('click', () => {
        window.location.href = `../chat/chat.html?groupId=${g.id}`;
      });
      $('#groupList').append(card);
    });
  };

  $(function() {
    fetch('/api/lobby')
      .then(res => {
        if (!res.ok) throw new Error('网络错误 ' + res.status);
        return res.json();
      })
      .then(data => {
        if (!Array.isArray(data)) {
          console.error('后端返回的数据不是数组：', data);
          return;
        }
        renderGroups(data);
      })
      .catch(err => {
        console.error('拉取聊天室列表失败', err);
        $('#groupList').html('<div class="text-danger">加载失败，请稍后重试</div>');
      });
  });


  $(function() {
    renderGroups();

    // 创建新群
    $('#createGroupBtn').on('click', () => {
      const name = $('#newGroupName').val().trim();
      if (!name) return alert('Please enter a group name.');
      // TODO: 调用后端接口创建群组，拿到实际返回的 id
      const newId = 'g' + (groups.length + 1);
      groups.push({ id: newId, name });
      renderGroups();
      $('#newGroupName').val('');
    });

    // 退出登录
    $('#logoutBtn').on('click', () => {
      // TODO: 清理登录状态（Cookie/Token），然后跳回登录页面
      window.location.href = 'index.html';
    });
  });



</script>
</body>
</html>
